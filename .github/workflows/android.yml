name: Build and test

# Builds the app, runs Android Lint, and runs all JVM unit tests (app +
# generator) so regressions surface on push instead of at the next local build.
# Known lint issues live in app/lint-baseline.xml; only new ones fail the build.
# Pushes to main also
# publish the debug APK to the rolling "latest" release, so the newest build
# is always at .../releases/latest/download/podly-debug.apk.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Rapid pushes supersede each other: cancel the in-flight run instead of queueing
# a stale build — the newest push republishes the APK anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Job-level because the secrets context is not allowed in a step's `if`.
    env:
      DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6.3.0

      # Sign with the shared debug keystore so published APKs can update
      # existing installs (a runner-generated keystore changes every run,
      # making the rolling release install-once-only). Skipped when the
      # secret is unavailable (e.g. PRs from forks) — those builds still
      # work, they just sign with a throwaway key.
      # AGP resolves its .android dir via XDG_CONFIG_HOME (set on GitHub
      # runners) before falling back to ~/.android, so cover both.
      - name: Restore shared debug keystore
        if: env.DEBUG_KEYSTORE_B64 != ''
        run: |
          for dir in "${XDG_CONFIG_HOME:-$HOME/.config}/.android" "$HOME/.android"; do
            mkdir -p "$dir"
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > "$dir/debug.keystore"
          done

      - name: Build, lint, and run unit tests
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest :generator:test --no-daemon

      - name: Publish APK to rolling "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk podly-debug.apk
          # Keep the "latest" tag on the commit the APK was built from.
          git tag -f latest
          git push --force origin refs/tags/latest
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "Latest build" --verify-tag \
              --notes "Debug APK from the newest push to main."
          fi
          gh release edit latest \
            --notes "Debug APK built from $(git rev-parse --short HEAD), $(date -u +'%Y-%m-%d %H:%M UTC')."
          gh release upload latest podly-debug.apk --clobber
