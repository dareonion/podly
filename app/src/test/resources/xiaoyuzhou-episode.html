<!DOCTYPE html><html><head><meta charset="utf-8"><title>trimmed 小宇宙 page</title></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"episode":{"type":"EPISODE","eid":"602fa117139c2fe28f504d45","pid":"5e280fad418a84a0461fb38b","title":"E468.我是来自河南的犹太人","description":"故事FM ❜ 第 468 期\n犹太民族可以说是一个真正的苦难的民族。从罗马帝国对犹太人起义的镇压开始，他们就离开故土，流亡了一千八百多年。历史上，他们被很多国家和文明迫害、驱逐过。\n十九世纪末，犹太人西奥多·赫茨尔发起犹太复国主义运动，号召散居全世界的犹太人「回归故土」。1948 年，以色列建国后，更是加速了这一进程。\n但这时候人们才发现，经过将近两千年和世界各族人民的通婚，犹太后裔已经分散在各色人种当中了。这其中有白人、有黑人，还有中国人。\n本期的讲述者金锦，就是一名生在中国河南开封的犹太人。\n/Staff/\n讲述者 | 金锦\n主播 | @寇爱哲\n制作人 | 马达\n声音设计 | @故事FM ","duration":2088,"enclosure":{"url":"https://media.xyzcdn.net/lt4fZFfs-BkP6eS09OC6vKOy4H4v.m4a"},"media":{"id":"lt4fZFfs-BkP6eS09OC6vKOy4H4v.m4a","mimeType":"audio/mp4","source":{"mode":"PUBLIC","url":"https://media.xyzcdn.net/lt4fZFfs-BkP6eS09OC6vKOy4H4v.m4a"}},"pubDate":"2021-02-19T11:22:33.000Z","payType":"FREE","status":"NORMAL","podcast":{"type":"PODCAST","pid":"5e280fad418a84a0461fb38b","title":"故事FM","author":"寇爱哲","image":{"picUrl":"https://image.xyzcdn.net/FsdM67oG8kA_CGCZo2K6Sa9HAEQr","width":1600,"height":1600,"format":"png","thumbnailUrl":"https://image.xyzcdn.net/FsdM67oG8kA_CGCZo2K6Sa9HAEQr@thumbnail","smallPicUrl":"https://image.xyzcdn.net/FsdM67oG8kA_CGCZo2K6Sa9HAEQr@small","middlePicUrl":"https://image.xyzcdn.net/FsdM67oG8kA_CGCZo2K6Sa9HAEQr@middle","largePicUrl":"https://image.xyzcdn.net/FsdM67oG8kA_CGCZo2K6Sa9HAEQr@large"}}}}},"page":"/episode/[id]"}</script></body></html>
