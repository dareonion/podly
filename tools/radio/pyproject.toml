[project]
name = "podly-radio"
version = "0.1.0"
description = "Builds Podly's radio candidate pools and publishes them to GitHub Pages"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "lxml>=5.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
podly-radio = "podly_radio.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# date.today() is meant: the timers run on this machine's local calendar.
ignore = ["DTZ011"]
