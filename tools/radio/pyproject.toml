[project]
name = "podly-radio"
version = "0.1.0"
description = "Builds Podly's radio candidate pools and publishes them to GitHub Pages"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "lxml>=5.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
podly-radio = "podly_radio.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.3"]
