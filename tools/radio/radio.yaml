# Pool generation config. Profile ids must match RadioProfiles in the app.
profiles:
  - id: you
    label: You
    languages: [en, zh-Hant, zh-Hans]
    countries: [us, tw]
    target_entries: 250
    min_entries: 60
    min_shows: 20
    max_per_show: 3
    sweet_spot_minutes: [20, 75]
    hard_minutes: [3, 240]
    roster_size: 60
    # Kids & Family (+ Education/Stories for Kids), True Crime, Religion &
    # Spirituality and its subgenres. The app filters these out of "You" picks
    # anyway; excluding them here stops the pool spending slots on them.
    exclude_genres: [1305, 1519, 1520, 1488, 1314, 1438, 1439, 1440, 1441, 1442, 1444, 1445]
    # Parenting and Pets & Animals sit under Kids & Family but are for adults.
    exempt_genres: [1521, 1522]
    listener: >
      An adult who listens while commuting and doing chores. Wants the most
      worthwhile shows in English and Mandarin: award winners, critically
      praised reporting, sharp interviews, and the popular ones that earn it.
      Avoid daily news churn and anything gimmicky. Never children's
      programming, true crime, or religious teaching. Shows for parents are
      welcome; shows for children are not.

  - id: toddler_zh
    label: "Toddler — Chinese"
    languages: [zh-Hant, zh-Hans]
    countries: [tw]
    # Kids & Family, Education for Kids, Stories for Kids.
    genres: [1305, 1519, 1520]
    search_terms: ["兒童故事", "幼兒", "睡前故事", "童謠", "親子", "繪本"]
    target_entries: 150
    min_entries: 30
    min_shows: 6
    max_per_show: 6
    sweet_spot_minutes: [3, 12]
    hard_minutes: [1, 20]
    roster_size: 30
    # Belt and braces on top of the app's own allowlist.
    require_clean: true
    listener: >
      A 30-month-old in a Mandarin-speaking home, listening with a parent
      nearby. Wants short, gentle Mandarin stories, songs and simple
      non-fiction. Absolutely no horror, death, crime, adult themes or
      politics — when in doubt, leave it out.
